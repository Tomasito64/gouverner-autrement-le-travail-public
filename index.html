<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gouverner autrement le travail public</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9edf0;color:#172b39;font:16px system-ui,sans-serif}header{background:#fff;padding:16px 24px;border-bottom:1px solid #d4dce2}h1{font:600 clamp(18px,3vw,26px) Georgia,serif;margin:0 0 12px}nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}button,a{font:inherit;border-radius:6px;padding:8px 12px}button{background:#fff;border:1px solid #a4b4bf;color:#172b39;cursor:pointer}button:disabled{opacity:.45;cursor:default}a{color:#174e70}button:focus-visible,a:focus-visible{outline:3px solid #2384bd;outline-offset:2px}#status{margin:12px 24px}main{overflow:auto;padding:8px 12px 32px;min-height:70vh}.sheet{position:relative;margin:0 auto 16px;background:white;box-shadow:0 3px 18px #172b3920}canvas{display:block}.textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;text-align:initial;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0}.textLayer :is(span,br){color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}.textLayer ::selection{background:#168aff55}.textLayer .markedContent{display:contents}noscript{display:block;padding:24px}
</style>
<header><h1>Gouverner autrement le travail public</h1><nav aria-label="Commandes du lecteur PDF"><span id="count">Lecture intégrale</span><button id="less" disabled aria-label="Réduire le zoom">−</button><button id="more" disabled aria-label="Augmenter le zoom">+</button><button id="fit" disabled>Adapter à l’écran</button><a href="document.pdf" target="_blank" rel="noopener">Ouvrir le PDF</a><a href="document.pdf" download="Gouverner autrement le travail public.pdf">Télécharger</a></nav></header>
<p id="status" role="status">Chargement du document…</p><main id="pages" aria-label="Article intégral — toutes les pages du PDF"></main>
<noscript>Activez JavaScript pour utiliser le lecteur, ou <a href="document.pdf">ouvrez directement le PDF</a>.</noscript>
<script type="module">
const $=id=>document.getElementById(id);
let pdf,lib,zoom=1,queue=Promise.resolve();
function requestRender(){queue=queue.then(render).catch(error=>{$('status').textContent='Le lecteur n’a pas pu afficher le document. Vous pouvez ouvrir directement le PDF avec le lien ci-dessus.';console.error(error)});return queue}
async function render(){
 if(!pdf)return;
 const z=zoom,width=Math.min(document.documentElement.clientWidth-24,1000),ratio=Math.min(window.devicePixelRatio||1,2);
 $('pages').setAttribute('aria-busy','true');
 try{
 for(let n=1;n<=pdf.numPages;n++){
  const page=await pdf.getPage(n),base=page.getViewport({scale:1}),scale=width/base.width*z,view=page.getViewport({scale});
  const sheet=document.createElement('section');sheet.className='sheet';sheet.id='page-'+n;sheet.setAttribute('aria-label',`Page ${n} sur ${pdf.numPages}`);
  sheet.style.width=view.width+'px';sheet.style.height=view.height+'px';sheet.style.setProperty('--scale-factor',scale);
  const canvas=document.createElement('canvas');canvas.setAttribute('aria-hidden','true');canvas.width=Math.floor(view.width*ratio);canvas.height=Math.floor(view.height*ratio);canvas.style.width=view.width+'px';canvas.style.height=view.height+'px';
  const text=document.createElement('div');text.className='textLayer';sheet.append(canvas,text);
  await page.render({canvasContext:canvas.getContext('2d'),viewport:view,transform:ratio===1?null:[ratio,0,0,ratio,0,0]}).promise;
  const previous=$('page-'+n);if(previous)previous.replaceWith(sheet);else $('pages').append(sheet);
  try{await new lib.TextLayer({textContentSource:await page.getTextContent(),container:text,viewport:view}).render()}catch(e){console.warn(e)}
 }
 $('count').textContent=`${pdf.numPages} pages · Lecture intégrale`;$('less').disabled=z<=.5;$('more').disabled=z>=2.5;$('fit').disabled=false;$('status').textContent='';
 }finally{$('pages').setAttribute('aria-busy','false')}
}
try{lib=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.min.mjs');lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.worker.min.mjs';pdf=await lib.getDocument('document.pdf').promise;await requestRender()}catch(error){$('status').textContent='Le lecteur n’a pas pu charger le document. Utilisez « Ouvrir le PDF » ci-dessus.';console.error(error)}
$('less').onclick=()=>{zoom=Math.max(.5,zoom-.25);requestRender()};$('more').onclick=()=>{zoom=Math.min(2.5,zoom+.25);requestRender()};$('fit').onclick=()=>{zoom=1;requestRender()};let timer;window.addEventListener('resize',()=>{clearTimeout(timer);timer=setTimeout(requestRender,200)});
</script></html>
