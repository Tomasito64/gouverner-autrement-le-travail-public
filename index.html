<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gouverner autrement le travail public</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9edf0;color:#172b39;font:16px system-ui,sans-serif}header{background:#fff;padding:16px 24px;border-bottom:1px solid #d4dce2}h1{font:600 clamp(18px,3vw,26px) Georgia,serif;margin:0 0 12px}nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}button,a{font:inherit;border-radius:6px;padding:8px 12px}button{background:#fff;border:1px solid #a4b4bf;color:#172b39;cursor:pointer}button:disabled{opacity:.45;cursor:default}a{color:#174e70}button:focus-visible,a:focus-visible{outline:3px solid #2384bd;outline-offset:2px}#position{min-width:105px;text-align:center}#status{margin:12px 24px}main{overflow:auto;padding:8px 12px 32px;min-height:70vh}.sheet{position:relative;margin:0 auto;background:white;box-shadow:0 3px 18px #172b3920}canvas{display:block}.textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;text-align:initial;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0}.textLayer :is(span,br){color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}.textLayer ::selection{background:#168aff55}.textLayer .markedContent{display:contents}noscript{display:block;padding:24px}
</style>
<header><h1>Gouverner autrement le travail public</h1><nav aria-label="Commandes du lecteur PDF"><button id="prev" disabled aria-label="Page précédente">←</button><span id="position" aria-live="polite">Chargement…</span><button id="next" disabled aria-label="Page suivante">→</button><button id="less" disabled aria-label="Réduire le zoom">−</button><button id="more" disabled aria-label="Augmenter le zoom">+</button><button id="fit" disabled>Adapter à l’écran</button><a href="document.pdf" target="_blank" rel="noopener">Ouvrir le PDF</a><a href="document.pdf" download="Gouverner autrement le travail public.pdf">Télécharger</a></nav></header>
<p id="status" role="status">Chargement du document…</p><main aria-label="Document PDF"><div class="sheet" id="sheet"><canvas id="canvas" aria-label="Page du document"></canvas><div id="text" class="textLayer"></div></div></main>
<noscript>Activez JavaScript pour utiliser le lecteur, ou <a href="document.pdf">ouvrez directement le PDF</a>.</noscript>
<script type="module">
const $=id=>document.getElementById(id);let pdf,pageNumber=1,zoom=1,queue=Promise.resolve();
function requestRender(){queue=queue.then(render).catch(error=>{$('status').textContent='Le lecteur n’a pas pu afficher cette page. Vous pouvez ouvrir directement le PDF avec le lien ci-dessus.';console.error(error)});return queue}
async function render(){if(!pdf)return;const n=pageNumber,z=zoom;const page=await pdf.getPage(n);const base=page.getViewport({scale:1});const scale=Math.min(window.innerWidth-24,1000)/base.width*z;const view=page.getViewport({scale});const ratio=Math.min(window.devicePixelRatio||1,2);const canvas=$('canvas');canvas.width=Math.floor(view.width*ratio);canvas.height=Math.floor(view.height*ratio);canvas.style.width=view.width+'px';canvas.style.height=view.height+'px';$('sheet').style.width=view.width+'px';$('sheet').style.height=view.height+'px';$('sheet').style.setProperty('--scale-factor',scale);$('text').replaceChildren();await page.render({canvasContext:canvas.getContext('2d'),viewport:view,transform:ratio===1?null:[ratio,0,0,ratio,0,0]}).promise;canvas.setAttribute('aria-label',`Page ${n} sur ${pdf.numPages}`);$('position').textContent=`${n} / ${pdf.numPages}`;$('prev').disabled=n<=1;$('next').disabled=n>=pdf.numPages;$('less').disabled=z<=.5;$('more').disabled=z>=2.5;$('fit').disabled=false;$('status').textContent='';try{await new lib.TextLayer({textContentSource:await page.getTextContent(),container:$('text'),viewport:view}).render()}catch(e){console.warn(e)}}
let lib;try{lib=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.min.mjs');lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.worker.min.mjs';pdf=await lib.getDocument('document.pdf').promise;await requestRender()}catch(error){$('status').textContent='Le lecteur n’a pas pu charger le document. Utilisez « Ouvrir le PDF » ci-dessus.';console.error(error)}
$('prev').onclick=()=>{if(pageNumber>1){pageNumber--;requestRender()}};$('next').onclick=()=>{if(pdf&&pageNumber<pdf.numPages){pageNumber++;requestRender()}};$('less').onclick=()=>{zoom=Math.max(.5,zoom-.25);requestRender()};$('more').onclick=()=>{zoom=Math.min(2.5,zoom+.25);requestRender()};$('fit').onclick=()=>{zoom=1;requestRender()};let timer;window.addEventListener('resize',()=>{clearTimeout(timer);timer=setTimeout(requestRender,200)});
</script></html>
